plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.26'
    id 'com.modrinth.minotaur' version '2.+'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = project.group
    version = project.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "${project.mod_id}-${project.name}-${project.minecraft_version}"
    }

    repositories {
        mavenCentral()
        mavenLocal()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = 'https://repo.spongepowered.org/repository/maven-public'
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
                includeGroupAndSubgroups("org.objectweb")
                includeGroup("org.objectweb.asm")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "CurseMaven"
                    url = "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        exclusiveContent {
            forRepositories(
                    maven {
                        name = "ParchmentMC"
                        url = "https://maven.parchmentmc.org/"
                    },
                    maven {
                        name = "NeoForge"
                        url = "https://maven.neoforged.net/releases"
                    }
            )
            filter {
                includeGroup('org.parchmentmc.data')
            }
        }
        maven {
            name = "Cloth Config"
            url = "https://maven.shedaniel.me/"
            content {
                includeGroupAndSubgroups "me.shedaniel"
            }
        }
        maven {
            name = "Cardinal Components"
            url = "https://maven.ladysnake.org/releases"
            content {
                includeGroup "dev.onyxstudios.cardinal-components-api"
                includeGroup "org.ladysnake.cardinal-components-api"
            }
        }
        maven {
            name = "Journeymap API"
            url = "https://jm.gserv.me/repository/maven-public/"
            content {
                includeGroup "info.journeymap"
            }
        }
        maven {
            name = "Curios"
            url = "https://maven.theillusivec4.top/"
            content {
                includeGroup "top.theillusivec4.curios"
            }
        }
        maven {
            name = "Mod Menu / Trinkets"
            url = "https://maven.terraformersmc.com/releases/"
            content {
                includeGroup "com.terraformersmc"
                includeGroup "dev.emi"
            }
        }
        maven {
            name = "Accessories"
            url = "https://maven.wispforest.io/releases"
            content {
                includeGroup "io.wispforest"
                includeGroup "io.wispforest.endec"
            }
        }
        maven {
            name = "Accessories Dependencies"
            url = "https://maven.su5ed.dev/releases"
            content {
                includeGroup "dev.su5ed.sinytra.fabric-api"
                includeGroup "org.sinytra.forgified-fabric-api"
            }
        }
        maven {
            name = "Forge Config API Port"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
            content {
                includeGroup "fuzs.forgeconfigapiport"
            }
        }
        maven {
            name = "DevAuth"
            url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
            content {
                includeGroup "me.djtheredstoner"
            }
        }
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
            content {
                includeGroup "dev.architectury"
            }
        }
        maven {
            name = "FTB"
            url = "https://maven.ftb.dev/releases"
            content {
                includeGroup "dev.ftb.mods"
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('net.fabricmc.unpick')
                includeGroup('net.fabricmc.fabric-api')
                includeGroup('fabric-loom')
            }
        }
        maven {
            name = "NeoForge"
            url = "https://maven.neoforged.net/releases"
        }
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = "Curios Backup"
            url 'https://modmaven.dev/'
            content {
                includeGroup "top.theillusivec4.curios"
            }
        }
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${project.minecraft_version}"
        //mappings loom.officialMojangMappings()
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft}:${project.parchment_version}@zip")
        }
        implementation 'org.jetbrains:annotations:24.1.0'
        implementation 'com.demonwav.mcdev:annotations:2.1.0'
    }

    // Declare capabilities on the outgoing configurations.
    // Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
    ['apiElements', 'runtimeElements'].each { variant ->
        configurations."$variant".outgoing {
            capability("$group:${project.name}:$version")
            capability("$group:${base.archivesName.get()}:$version")
            capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
            capability("$group:$mod_id:$version")
        }
        publishing.publications.configureEach {
            suppressPomMetadataWarningsFor(variant)
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }

    processResources {
        var expandProps = ["version"                      : mod_version,
                           "group"                        : project.group, //Else we target the task's group.
                           "minecraft_version"            : minecraft_version,
                           "minecraft_version_range"      : minecraft_version_range,
                           "forge_version"                : forge_version,
                           "forge_loader_version_range"   : forge_loader_version_range,
                           "forge_version_range"          : forge_version_range,
                           "fabric_api_version"           : fabric_api_version,
                           "fabric_loader_version"        : fabric_loader_version,
                           "fabric_version_range"         : fabric_version_range,
                           'neoforge_version'             : neoforge_version,
                           'neoforge_version_range'       : neoforge_version_range,
                           'neoforge_loader_version_range': neoforge_loader_version_range,
                           "mod_name"                     : mod_name,
                           "mod_author"                   : mod_author,
                           "mod_id"                       : mod_id,
                           "license"                      : license,
                           "description"                  : project.description,
                           "repoURL"                      : repoURL,
                           "issueTrackerURL"              : issueTrackerURL,
                           "credits"                      : credits,
                           "java_version"                 : java_version
        ]
        var jsonExpandProps = expandProps.collectEntries {
            key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
        }

        filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand expandProps
        }

        filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
            expand jsonExpandProps
        }

        inputs.properties(expandProps)
    }
}

tasks.register('latestChangelog') {
    group = "changelog"

    String fullChangelogText = file("CHANGELOG.md").getText()

    int firstHeading = fullChangelogText.indexOf("## [")
    int nextHeading = fullChangelogText.indexOf("## [", firstHeading + 1)

    String latestChangelogText = fullChangelogText.substring(firstHeading, nextHeading)

    outputs.upToDateWhen {
        if (file("LATEST_CHANGELOG.md").exists()) {
            return latestChangelogText == file("LATEST_CHANGELOG.md").getText()
        } else return false
    }

    outputs.file file("LATEST_CHANGELOG.md")
    doLast {
        def latestChangelog = file("LATEST_CHANGELOG.md")
        latestChangelog.text = latestChangelogText
        printf(latestChangelog.text)
    }
}

tasks.register('publishAll') {
    group = "upload"

    dependsOn("latestChangelog")
    dependsOn("fabric:publishFabric")
    //dependsOn("forge:publishForge")
    dependsOn("neoforge:publishNeoForge")
}