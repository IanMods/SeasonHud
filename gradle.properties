  \n \
  Currently supported season mods are:\n \
   - Serene Seasons\n \
   - Fabric Seasons\n \
   - TerraFirmaCraft (Forge 1.18.2/1.20.1/1.21.1)\n \
   - Ecliptic Seasons (Forge/Neoforge)
repoURL=https://github.com/IanMods/SeasonHUD
issueTrackerURL=https://github.com/IanMods/SeasonHUD/issues
