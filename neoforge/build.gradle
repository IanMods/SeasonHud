plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = project.neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            var clientDir = "run/client"
            if (!file(clientDir).exists()) {
                mkdir(clientDir)
            }
            setGameDirectory(file(clientDir))
        }
        data {
            clientData()
            serverData()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server {
                server()
                var serverDir = "run/server"
                if (!file(serverDir).exists()) {
                    mkdir(serverDir)
                }
                setGameDirectory(file(serverDir))
            }
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}


sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = uri("https://cursemaven.com")
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth Maven"
                url = uri("https://api.modrinth.com/maven")
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }


    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = uri("https://maven.parchmentmc.org/")
                },
                maven {
                    name = "NeoForge"
                    url = uri('https://maven.neoforged.net/releases')
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }

    maven {
        name = "Forge Config API Port Maven"
        url = uri("https://raw.githubusercontent.com/Fuzss/modresources/main/maven/")
        content {
            includeGroup "fuzs.forgeconfigapiport"
        }
    }

    maven {
        name = "DevAuth Maven"
        url = uri("https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1")
        content {
            includeGroup "me.djtheredstoner"
        }
    }

    maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net/releases')
        content {
            includeGroup "com.github.glitchfiend"
        }
    }

    maven {
        name = "FTB Maven"
        url = uri("https://maven.ftb.dev/releases")
        content {
            includeGroup "dev.ftb.mods"
        }
    }

    maven {
        name = "shedaniel Maven"
        url = uri("https://maven.shedaniel.me/")
        content {
            includeGroup "me.shedaniel"
            includeGroup "dev.architectury"
            includeGroup "me.shedaniel.cloth"
        }
    }

    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "info.journeymap"
        }
    }

    maven {
        name = "Xaero Maven"
        url = uri("https://chocolateminecraft.com/maven")
        content {
            includeGroup "xaero.lib"
            includeGroup "xaero.minimap"
        }
    }

    maven {
        name = "Homeostatic Seasons"
        url = uri("https://raw.githubusercontent.com/wendall911/maven/main/")
        content {
            includeGroup "com.github.wendall911.climatesettings"
            includeGroup "com.github.wendall911.homeostaticseasons"
            includeGroup "technology.roughness.whitenoise"
        }
    }

    maven {
        name = "Accessories Maven"
        url = uri("https://maven.wispforest.io/releases")
        content {
            includeGroup "io.wispforest"
            includeGroup "io.wispforest.endec"
        }
    }

    maven {
        name = "Sinytra Maven"
        url = uri("https://maven.su5ed.dev/releases")
    }

    maven {
        name = "ModMaven (Backup)"
        url = uri("https://modmaven.dev/")
    }

    maven {
        name = "Curios Maven"
        url = uri("https://maven.theillusivec4.top/")
    }
}

dependencies {
    compileOnly "com.demonwav.mcdev:annotations:2.1.0"

    // Serene Seasons
    compileOnly "com.github.glitchfiend:SereneSeasons-neoforge:${project.serene_seasons_version}"
    compileOnly "com.github.glitchfiend:GlitchCore-neoforge:${project.glitchcore_version}"
    compileOnly("net.jodah:typetools:0.6.3")

    // Terrafirmacraft
    compileOnly "maven.modrinth:terrafirmacraft:${project.terrafirmacraft_version}"
    compileOnly "maven.modrinth:patchouli:${project.patchouli_version}-neoforge"

    // Ecliptic Seasons
    compileOnly "curse.maven:ecliptic-seasons-1118306:${project.ecliptic_seasons_version}"

    // Homeostatic Seasons
    compileOnly "com.github.wendall911.climatesettings:climatesettings-${project.homeostatic_seasons_mc_version}-neoforge:${project.climatesettings_version}"
    compileOnly "com.github.wendall911.homeostaticseasons:homeostaticseasons-${project.homeostatic_seasons_mc_version}-neoforge:${project.homeostatic_seasons_version}"
    compileOnly "technology.roughness.whitenoise:whitenoise-${project.homeostatic_seasons_mc_version}-neoforge:${project.whitenoise_version}"

    // ProtoManly's Weather
    compileOnly "maven.modrinth:protomanlys-weather:${project.protomanlys_version}"

    // Xaero's Minimap
    compileOnly "xaero.minimap:xaerominimap-neoforge-${project.minecraft_version}:${project.xaero_minimap_version}"
    compileOnly "xaero.lib:xaerolib-neoforge-${project.minecraft_version}:${project.xaero_lib_version}"

    // JourneyMap
    compileOnly("info.journeymap:journeymap-api-neoforge:${project.journeymap_api_version}-SNAPSHOT") {
        changing = true
    }
    compileOnly "maven.modrinth:journeymap:${project.journeymap_version_neoforge}"

    // FTB Chunks + Dependencies
    // Disabled until FTBChunks is updated
//    compileOnly "dev.ftb.mods:ftb-library-neoforge:${project.ftb_library_version}"
//    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${project.ftb_teams_version}"
//    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:${project.ftb_chunks_version}"
//    compileOnly "dev.architectury:architectury-neoforge:${project.architectury_version}"

    // Map Atlases
    compileOnly "maven.modrinth:map-atlases-forge:${project.map_atlases_version_neoforge}"
    compileOnly "maven.modrinth:moonlight:${project.moonlight_version_neoforge}"

    // Curios
    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
    compileOnlyApi "top.theillusivec4.curios:curios-neoforge:${project.curios_version}:api"

    // Accessories
    compileOnly("io.wispforest:accessories-neoforge:${project.accessories_version}")
    compileOnly("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Development QOL
    implementation "me.djtheredstoner:DevAuth-neoforge:${project.devauth_version}"
    //implementation "maven.modrinth:sodium:${project.sodium_version_neoforge}"

    // Minimap Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.minimap_mod.toLowerCase(Locale.ROOT)) {
        case "xaero":
            implementation "xaero.minimap:xaerominimap-neoforge-${project.minecraft_version}:${project.xaero_minimap_version}"
            implementation "xaero.lib:xaerolib-neoforge-${project.minecraft_version}:${project.xaero_lib_version}"
            break
        case "journey":
//            implementation("info.journeymap:journeymap-api-neoforge:${project.journeymap_api_version}-SNAPSHOT") {
//                changing = true
//            }
            implementation "maven.modrinth:journeymap:${project.journeymap_version_neoforge}"
            implementation("maven.modrinth:common-network:${project.common_network_version}-neoforge")
            break
        case "ftb":
            // Disabled until FTBChunks is updated
//            implementation("dev.ftb.mods:ftb-library-neoforge:${project.ftb_library_version}") { transitive = false }
//            implementation("dev.ftb.mods:ftb-teams-neoforge:${project.ftb_teams_version}") { transitive = false }
//            implementation("dev.ftb.mods:ftb-chunks-neoforge:${project.ftb_chunks_version}") { transitive = false }
//            implementation "dev.architectury:architectury-neoforge:${project.architectury_version}"
            break
        case "atlas":
            implementation "maven.modrinth:map-atlases-forge:${project.map_atlases_version_neoforge}"
            implementation "maven.modrinth:moonlight:${project.moonlight_version_neoforge}"
            break
        case "none":
            break
        default: println("Unknown recipe viewer specified: ${project.minimap_mod}. Must be xaero, journey, ftb, " +
                "atlas, or none")
    }

    // Season Mod Dev Tests (Forge)
    // See root gradle.properties to choose which to use at runtime.
    switch (project.season_mod_neoforge.toLowerCase(Locale.ROOT)) {
        case "serene":
            implementation "com.github.glitchfiend:SereneSeasons-neoforge:${project.serene_seasons_version}"
            implementation "com.github.glitchfiend:GlitchCore-neoforge:${project.glitchcore_version}"
            implementation("net.jodah:typetools:0.6.3")
            break
        case "terra":
            implementation "maven.modrinth:terrafirmacraft:${project.terrafirmacraft_version}"
            implementation "maven.modrinth:patchouli:${project.patchouli_version}-neoforge"
            break
        case "ecliptic":
            implementation "curse.maven:ecliptic-seasons-1118306:${project.ecliptic_seasons_version}"
            break
        case "homeostatic":
            implementation "com.github.wendall911.climatesettings:climatesettings-${project.homeostatic_seasons_mc_version}-neoforge:${project.climatesettings_version}"
            implementation "com.github.wendall911.homeostaticseasons:homeostaticseasons-${project.homeostatic_seasons_mc_version}-neoforge:${project.homeostatic_seasons_version}"
            implementation "technology.roughness.whitenoise:whitenoise-${project.homeostatic_seasons_mc_version}-neoforge:${project.whitenoise_version}"
            break
        case "protomanlys":
            implementation "maven.modrinth:protomanlys-weather:${project.protomanlys_version}"
            break
        default: println("Unknown season mod specified: ${project.minimap_mod}. Must be serene, terra, or ecliptic")
    }

    // Accessory Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.accessory_mod.toLowerCase(Locale.ROOT)) {
        case "accessories":
            implementation "io.wispforest:accessories-neoforge:${project.accessories_version}"
            implementation "io.wispforest:owo-lib-neoforge:${project.owo_version_neoforge}"
            implementation("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}") {
                exclude(group: "fabric-api")
            }

            forgeRuntimeLibrary(implementation("blue.endless:jankson:1.2.2"))

            forgeRuntimeLibrary("io.wispforest:endec:${project.endec_version}")
            forgeRuntimeLibrary("io.wispforest.endec:gson:${project.endec_gson_version}")
            forgeRuntimeLibrary("io.wispforest.endec:jankson:${project.endec_jankson_version}")
            forgeRuntimeLibrary("io.wispforest.endec:netty:${project.endec_netty_version}")

            break
        case "none":
            break
        default: println("Unknown accessory mod specified: ${project.minimap_mod}. Must be accessories, or none")
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

publishMods {
    displayName = "${mod_id}-neoforge-${minecraft_version}-${mod_version}"
    version = "${minecraft_version}-${mod_version}"
    file = tasks.jar.archiveFile
    modLoaders.add("neoforge")

    def cfOptions = curseforgeOptions {
        accessToken = System.getenv("CURSEFORGE_TOKEN")
        changelogType = "markdown"
        javaVersions.add(JavaVersion.toVersion(project.java_version))
        minecraftVersions.addAll(curseforge_gameVersions.split(","))
        projectId = project.curseforge_forge_id
    }

    def mrOptions = modrinthOptions {
        accessToken = System.getenv("MODRINTH_TOKEN")
        minecraftVersions.addAll(modrinth_gameVersions.split(","))
        projectId = project.modrinth_forge_id
    }

    curseforge("curseforgeNeoForge") {
        from cfOptions

        optional("serene-seasons", "terrafirmacraft", "ecliptic-seasons")
        optional("ftb-chunks-forge", "journeymap", "xaeros-minimap", "xaeros-minimap-fair-play-edition", "map-atlases-forge")
        optional("curios", "accessories")
    }

    modrinth("modrinthNeoForge") {
        from mrOptions

        optional("serene-seasons", "terrafirmacraft", "protomanlys-weather")
        optional("journeymap", "xaeros-minimap", "xaeros-minimap-fair", "map-atlases-forge")
        optional("curios", "accessories")

    }
}