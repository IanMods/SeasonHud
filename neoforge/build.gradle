plugins {
    id 'com.gradleup.shadow'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
}

loom {
    runs {
        client {
            client()
            setConfigName("NeoForge Client")
            ideConfigGenerated(true)
            runDir("run-client")
        }
        server {
            server()
            setConfigName("NeoForge Server")
            ideConfigGenerated(true)
            runDir("run-server")
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modLocalRuntime("me.djtheredstoner:DevAuth-neoforge:${devauth_version}")

    //Serene Seasons
    modCompileOnly "com.github.glitchfiend:SereneSeasons-neoforge:1.21.9-${serene_seasons_version}"
    modCompileOnly "com.github.glitchfiend:GlitchCore-neoforge:1.21.9-${glitchcore_version}"
    implementation("net.jodah:typetools:0.6.3")

    //Terrafirmacraft
    modCompileOnly "maven.modrinth:terrafirmacraft:${project.terrafirmacraft_version}"
    modCompileOnly "maven.modrinth:patchouli:${project.patchouli_version}-neoforge"

    //Ecliptic Seasons
    modCompileOnly "curse.maven:ecliptic-seasons-1118306:${project.ecliptic_seasons_version}"

    //Xaero's Minimap
    modCompileOnly "maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_NeoForge_1.21.9"

    //JourneyMap
    compileOnly group: 'info.journeymap', name: 'journeymap-api-neoforge', version: project.journeymap_api_version, changing: true
    modCompileOnly "maven.modrinth:journeymap:${project.journeymap_version}+neoforge"

    //FTB Chunks + Dependencies
    modCompileOnly "dev.ftb.mods:ftb-library-neoforge:${project.ftb_library_version}"
    modCompileOnly "dev.ftb.mods:ftb-teams-neoforge:${project.ftb_teams_version}"
    modCompileOnly "dev.ftb.mods:ftb-chunks-neoforge:${project.ftb_chunks_version}"

    modCompileOnly "maven.modrinth:architectury-api:${project.architectury_version}+neoforge"

    //Map Atlases
    modCompileOnly "maven.modrinth:map-atlases-forge:neoforge_1.21-${project.map_atlases_version}"
    modCompileOnly "maven.modrinth:moonlight:1.21-${project.moonlight_version}-neoforge"
    modCompileOnly "maven.modrinth:immediatelyfast:${project.immediatelyfast_version}+${minecraft_version}-neoforge"

    //Curios + Accessories
    modCompileOnly("io.wispforest:accessories-neoforge:${project.accessories_version}")
    modCompileOnly("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modCompileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"


    // Development QOL
//    modLocalRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }

    // Minimap Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.minimap_mod.toLowerCase(Locale.ROOT)) {
        case "xaero":
            modLocalRuntime "maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_NeoForge_1.21.9"
            break
        case "journey":
            implementation group: 'info.journeymap', name: 'journeymap-api-neoforge', version: project.journeymap_api_version, changing: true
            modImplementation("maven.modrinth:journeymap:${project.journeymap_version}+neoforge")
            modImplementation("maven.modrinth:common-network:${project.common_network_version}-neoforge")
            break
        case "ftb":
            modLocalRuntime "dev.ftb.mods:ftb-library-neoforge:${project.ftb_library_version}"
            modLocalRuntime "dev.ftb.mods:ftb-teams-neoforge:${project.ftb_teams_version}"
            modLocalRuntime "dev.ftb.mods:ftb-chunks-neoforge:${project.ftb_chunks_version}"
            modLocalRuntime "maven.modrinth:architectury-api:${project.architectury_version}+neoforge"
            break
        case "atlas":
            modLocalRuntime "maven.modrinth:map-atlases-forge:neoforge_1.21-${project.map_atlases_version}"
            modLocalRuntime "maven.modrinth:moonlight:1.21-${project.moonlight_version}-neoforge"
            modLocalRuntime "maven.modrinth:immediatelyfast:${project.immediatelyfast_version}+${minecraft_version}-neoforge"
        case "none":
            break
        default: println("Unknown recipe viewer specified: ${project.minimap_mod}. Must be xaero, journey, ftb, " +
                "atlas, or none")
    }

    // Season Mod Dev Tests (NeoForge)
    // See root gradle.properties to choose which to use at runtime.
    switch (project.season_mod_neoforge.toLowerCase(Locale.ROOT)) {
        case "serene":
            modLocalRuntime "com.github.glitchfiend:SereneSeasons-neoforge:1.21.9-${serene_seasons_version}"
            modLocalRuntime "com.github.glitchfiend:GlitchCore-neoforge:1.21.9-${glitchcore_version}"
            implementation("net.jodah:typetools:0.6.3")
            break
        case "terra":
            modImplementation "maven.modrinth:terrafirmacraft:${project.terrafirmacraft_version}"
            modImplementation "maven.modrinth:patchouli:${project.patchouli_version}-neoforge"
            break
        case "ecliptic":
            modImplementation "curse.maven:ecliptic-seasons-1118306:${project.ecliptic_seasons_version}"
            break
        default: println("Unknown season mod specified: ${project.minimap_mod}. Must be serene, terra, or ecliptic")
    }

    // Accessory Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.accessory_mod.toLowerCase(Locale.ROOT)) {
        case "accessories":
            modLocalRuntime("maven.modrinth:accessories:${project.accessories_version}-neoforge")
            modLocalRuntime "maven.modrinth:owo-lib:${project.owo_version_neoforge}-neoforge"
            modLocalRuntime("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}") {
                exclude(group: "net.fabricmc.fabric-api")
            }
            break
        case "none":
            break
        default: println("Unknown accessory mod specified: ${project.minimap_mod}. Must be accessories, or none")
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

modrinth {
    debugMode = false
    token = System.getenv("MODRINTH_TOKEN")
    projectId = modrinth_forge_id
    versionNumber = minecraft_version + "-" + version
    versionName = base.archivesName.get() + "-" + mod_version
    versionType = "release"
    uploadFile = remapJar

    List<String> mcVersions = modrinth_gameVersions.split(",")
    gameVersions = mcVersions
    loaders = ["neoforge"]

    changelog = projectDir.toPath().getParent().resolve("LATEST_CHANGELOG.md").getText()

    dependencies {
        optional.project "serene-seasons"
        optional.project "terrafirmacraft"
        optional.project "curios"
        optional.project "accessories"
        optional.project "xaeros-minimap"
        optional.project "xaeros-minimap-fair"
        optional.project "journeymap"
        optional.project "map-atlases"
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    debugMode = false
    disableVersionDetection()
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    def mainFile = upload(curseforge_forge_id, remapJar)
    mainFile.changelogType = "markdown"
    mainFile.changelog = projectDir.toPath().getParent().resolve("LATEST_CHANGELOG.md").getText()
    mainFile.releaseType = "release"

    List<String> mcVersions = curseforge_gameVersions.split(",")
    mainFile.gameVersions = mcVersions
    mainFile.addGameVersion("NeoForge")
    mainFile.addJavaVersion("Java 21")

    mainFile.addOptional("serene-seasons")
    mainFile.addOptional("terrafirmacraft")
    mainFile.addOptional("ecliptic-seasons")
    mainFile.addOptional("curios")
    mainFile.addOptional("accessories")
    mainFile.addOptional("xaeros-minimap")
    mainFile.addOptional("xaeros-minimap-fair-play-edition")
    mainFile.addOptional("ftb-chunks-forge")
    mainFile.addOptional("journeymap")
    mainFile.addOptional("map-atlases-forge")
}

tasks.register('publishNeoForge') {
    group = "upload"
    dependsOn(tasks.publishCurseForge)
    dependsOn(tasks.modrinth)
}