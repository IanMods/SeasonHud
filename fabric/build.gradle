plugins {
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run-client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run-server")
        }
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation("net.fabricmc:fabric-loader:${project.fabric_loader_version}")

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Forge Config API Port
    modImplementation("com.electronwill.night-config:core:3.6.3")
    modImplementation("com.electronwill.night-config:toml:3.6.3")
    modImplementation("net.minecraftforge:forgeconfigapiport-fabric:${project.forge_config_api_port_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Fabric Seasons + Extras
    modImplementation("maven.modrinth:fabric-seasons:${project.fabric_seasons_version}")

    // Xaero's Minimap
    modCompileOnly "xaero.minimap:xaerominimap-fabric-${project.xaero_mc_version}:${project.xaero_minimap_version}"
    modCompileOnly "xaero.lib:xaerolib-fabric-${project.xaero_mc_version}:${project.xaero_lib_version}"

    // JourneyMap
    modCompileOnlyApi("info.journeymap:journeymap-api:${project.journeymap_api_version}-SNAPSHOT") {
        changing = true
    }
    modCompileOnly("maven.modrinth:journeymap:${project.journeymap_version_fabric}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // FTB Chunks + Dependencies
    modCompileOnly("curse.maven:ftb-chunks-fabric-472657:${project.ftb_chunks_fabric_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("curse.maven:ftb-library-fabric-438495:${project.ftb_library_fabric_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("curse.maven:ftb-teams-fabric-438497:${project.ftb_teams_fabric_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("maven.modrinth:architectury-api:${project.architectury_version}+fabric") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Map Atlases
    modCompileOnly("maven.modrinth:map-atlases:${project.map_atlases_fabric_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    //Trinkets + Accessories
    modCompileOnly("dev.emi:trinkets:${project.trinkets_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    //VoxelMap
    modCompileOnly("curse.maven:voxelmap-225179:${project.voxelmap_fabric_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    //Trinkets + Accessories
    modCompileOnly("dev.emi:trinkets:${project.trinkets_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"

    // Development QOL
    modLocalRuntime("me.djtheredstoner:DevAuth-fabric:${project.devauth_version}")
    modLocalRuntime "maven.modrinth:lazydfu:${project.lazydfu_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Minimap Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.minimap_mod.toLowerCase(Locale.ROOT)) {
        case "xaero":
            modImplementation "xaero.minimap:xaerominimap-fabric-${project.xaero_mc_version}:${project.xaero_minimap_version}"
            modImplementation "xaero.lib:xaerolib-fabric-${project.xaero_mc_version}:${project.xaero_lib_version}"
            break
        case "journey":
            break
        case "ftb":
            modLocalRuntime("curse.maven:ftb-chunks-fabric-472657:${project.ftb_chunks_fabric_version}")
            modLocalRuntime("curse.maven:ftb-library-fabric-438495:${project.ftb_library_fabric_version}")
            modLocalRuntime("curse.maven:ftb-teams-fabric-438497:${project.ftb_teams_fabric_version}")
            modLocalRuntime("maven.modrinth:architectury-api:${project.architectury_version}+fabric")
            break
        case "atlas":
            modLocalRuntime("maven.modrinth:map-atlases:${project.map_atlases_fabric_version}")
            modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")
            break
        case "voxel":
            modLocalRuntime("curse.maven:voxelmap-225179:${project.voxelmap_fabric_version}")
            break
        case "none":
            break
        default: println("Unknown minimap mod specified: ${project.minimap_mod}. Must be xaero, journey, ftb, " +
                "atlas, voxel, or none")
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publishMods {
    dryRun = false
    type = STABLE
    changelog = project.getRootDir().toPath().resolve("LATEST_CHANGELOG.md").getText()
    displayName = "${mod_id}-fabric-${minecraft_version}-${mod_version}"
    version = "${minecraft_version}-${mod_version}"
    file = tasks.remapJar.archiveFile
    modLoaders.add("fabric")

    curseforge("curseforgeFabric") {
        accessToken = System.getenv("CURSEFORGE_TOKEN")
        changelogType = "markdown"
        javaVersions.add(JavaVersion.toVersion(project.java_version))
        projectId = project.curseforge_fabric_id
        client = true
        server = true

        requires("forge-config-api-port")
        optional("serene-seasons", "fabric-seasons", "fabric-seasons-extras")
        optional("ftb-chunks-fabric", "journeymap", "xaeros-minimap", "xaeros-minimap-fair-play-edition", "map-atlases", "voxelmap")
        optional("trinkets")
    }

    modrinth("modrinthFabric") {
        accessToken = System.getenv("MODRINTH_TOKEN")
        minecraftVersions.addAll(modrinth_gameVersions.split(","))
        projectId = project.modrinth_fabric_id

        requires("forge-config-api-port")
        optional("serene-seasons", "fabric-seasons", "fabric-seasons-extras")
        optional("journeymap", "xaeros-minimap", "xaeros-minimap-fair", "map-atlases")
        optional("trinkets")
    }
}