plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run/server')
        }
    }
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = uri("https://cursemaven.com")
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth Maven"
                url = uri("https://api.modrinth.com/maven")
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net/releases')
        content {
            includeGroup "com.github.glitchfiend"
        }
    }

    maven {
        name = "Forge Config API Port Maven"
        url = uri("https://raw.githubusercontent.com/Fuzss/modresources/main/maven/")
        content {
            includeGroup "fuzs.forgeconfigapiport"
        }
    }

    maven {
        name = "DevAuth Maven"
        url = uri("https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1")
        content {
            includeGroup "me.djtheredstoner"
        }
    }

    maven {
        name = "FTB Maven"
        url = uri("https://maven.ftb.dev/releases")
        content {
            includeGroup "dev.ftb.mods"
        }
    }

    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "info.journeymap"
        }
    }

    maven {
        name = "shedaniel Maven"
        url = uri("https://maven.shedaniel.me/")
        content {
            includeGroup "me.shedaniel"
            includeGroup "dev.architectury"
            includeGroup "me.shedaniel.cloth"
        }
    }

    maven {
        name = "TerraformerMC Maven"
        url = uri("https://maven.terraformersmc.com/releases/")
        content {
            includeGroup "com.terraformersmc"
            includeGroup "dev.emi"
        }
    }

    maven {
        name = "LadySnake Maven - Cardinal Components"
        url = uri("https://maven.ladysnake.org/releases")
        content {
            includeGroup "dev.onyxstudios.cardinal-components-api"
            includeGroup "org.ladysnake.cardinal-components-api"
        }
    }

    maven {
        name = "Xaero Maven"
        url = uri("https://chocolateminecraft.com/maven")
        content {
            includeGroup "xaero.lib"
            includeGroup "xaero.minimap"
        }
    }

//    maven {
//        name = "Journeymap API MAven"
//        url = uri("https://jm.gserv.me/repository/maven-public/")
//        content {
//            includeGroup "info.journeymap"
//        }
//    }

    maven {
        name = "Homeostatic Seasons"
        url = uri("https://raw.githubusercontent.com/wendall911/maven/main/")
        content {
            includeGroup "com.github.wendall911.climatesettings"
            includeGroup "com.github.wendall911.homeostaticseasons"
            includeGroup "technology.roughness.whitenoise"
        }
    }

    maven {
        name = "Accessories Maven"
        url = uri("https://maven.wispforest.io/releases")
        content {
            includeGroup "io.wispforest"
            includeGroup "io.wispforest.endec"
        }
    }

    maven {
        name = "ModMaven (Backup)"
        url = uri("https://modmaven.dev/")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Forge Config API Port
    api "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"
    implementation("maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}-fabric") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Fabric Seasons + Extras
//    compileOnly("maven.modrinth:fabric-seasons:${project.fabric_seasons_version}")
//    compileOnly("maven.modrinth:fabric-seasons-extras:${project.fabric_seasons_extras_version}")

    // Serene Seasons
    compileOnly "com.github.glitchfiend:SereneSeasons-fabric:${project.serene_seasons_version}"
    compileOnly "com.github.glitchfiend:GlitchCore-fabric:${project.glitchcore_version}"
    compileOnly("net.jodah:typetools:0.6.3")

    // Homeostatic Seasons
    compileOnly "com.github.wendall911.climatesettings:climatesettings-${project.homeostatic_seasons_mc_version}-fabric:${project.climatesettings_version}"
    compileOnly "com.github.wendall911.homeostaticseasons:homeostaticseasons-${project.homeostatic_seasons_mc_version}-fabric:${project.homeostatic_seasons_version}"
    compileOnly "technology.roughness.whitenoise:whitenoise-${project.homeostatic_seasons_mc_version}-fabric:${project.whitenoise_version}"

    // Xaero's Minimap
    compileOnly "xaero.minimap:xaerominimap-fabric-${project.minecraft_version}:${project.xaero_minimap_version}"
    compileOnly "xaero.lib:xaerolib-fabric-${project.minecraft_version}:${project.xaero_lib_version}"

    // JourneyMap
    compileOnlyApi("info.journeymap:journeymap-api-fabric:${project.journeymap_api_version}") {
        changing = true
    }
    compileOnly("maven.modrinth:journeymap:${project.journeymap_version_fabric}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // FTB Chunks + Dependencies
    compileOnly "dev.ftb.mods:ftb-library-fabric:${project.ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-teams-fabric:${project.ftb_teams_version}"
    compileOnly "dev.ftb.mods:ftb-chunks-fabric:${project.ftb_chunks_version}"

    // Map Atlases
//    compileOnly("maven.modrinth:map-atlases:${project.map_atlases_version_fabric}") {
//        exclude group: 'net.fabricmc', module: 'fabric-loader'
//    }
//    compileOnly("maven.modrinth:moonlight:${project.moonlight_version_fabric}") {
//        exclude group: 'net.fabricmc', module: 'fabric-loader'
//    }

    // Trinkets
//    compileOnly("dev.emi:trinkets:${project.trinkets_version}") {
//        exclude group: 'net.fabricmc', module: 'fabric-loader'
//    }

    // Accessories
//    compileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
//    compileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
//    compileOnly("io.wispforest:accessories-fabric:${project.accessories_version}")
//    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
//        exclude group: 'net.fabricmc', module: 'fabric-loader'
//    }

    // Development QOL
    implementation("me.djtheredstoner:DevAuth-fabric:${project.devauth_version}")
    // implementation "maven.modrinth:sodium:${project.sodium_version_fabric}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Season Mod Dev Tests (Fabric)
    // See root gradle.properties to choose which to use at runtime.
    switch (project.season_mod_fabric.toLowerCase(Locale.ROOT)) {
        case "serene":
            implementation "com.github.glitchfiend:SereneSeasons-fabric:${project.serene_seasons_version}"
            implementation "com.github.glitchfiend:GlitchCore-fabric:${project.glitchcore_version}"
            implementation("net.jodah:typetools:0.6.3")
            break
        case "fabric":
//            implementation("maven.modrinth:fabric-seasons:${project.fabric_seasons_version}")
            break
        case "fabric+extra":
//            implementation("maven.modrinth:fabric-seasons:${project.fabric_seasons_version}")
//            implementation("maven.modrinth:fabric-seasons-extras:${project.fabric_seasons_extras_version}")
            break
        case "homeostatic":
            implementation "com.github.wendall911.climatesettings:climatesettings-${project.homeostatic_seasons_mc_version}-fabric:${project.climatesettings_version}"
            implementation "com.github.wendall911.homeostaticseasons:homeostaticseasons-${project.homeostatic_seasons_mc_version}-fabric:${project.homeostatic_seasons_version}"
            implementation "technology.roughness.whitenoise:whitenoise-${project.homeostatic_seasons_mc_version}-fabric:${project.whitenoise_version}"
            break
        default:
            println("Unknown season mod specified: ${project.season_mod_fabric}. Must be serene or fabric")
            break
    }

    // Minimap Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.minimap_mod.toLowerCase(Locale.ROOT)) {
        case "xaero":
            implementation "xaero.minimap:xaerominimap-fabric-${project.minecraft_version}:${project.xaero_minimap_version}"
            implementation "xaero.lib:xaerolib-fabric-${project.minecraft_version}:${project.xaero_lib_version}"
            break
        case "journey":
            implementation("info.journeymap:journeymap-api-fabric:${project.journeymap_api_version}-SNAPSHOT") {
                changing = true
            }
            implementation("maven.modrinth:journeymap:${project.journeymap_version_fabric}")
            implementation("maven.modrinth:common-network:${project.common_network_version}-fabric")
            break
        case "ftb":
            implementation "dev.ftb.mods:ftb-library-fabric:${project.ftb_library_version}"
            implementation "dev.ftb.mods:ftb-teams-fabric:${project.ftb_teams_version}"
            implementation "dev.ftb.mods:ftb-chunks-fabric:${project.ftb_chunks_version}"
            break
        case "atlas":
//            implementation("maven.modrinth:map-atlases:${project.map_atlases_version_fabric}")
//            implementation("maven.modrinth:moonlight:${project.moonlight_version_fabric}")
//            implementation("dev.onyxstudios.cardinal-components-api:cardinal-components-item:${project.cardinal_components_version}")
//            implementation("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}")
//            implementation("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}")
            break
        case "none":
            break
        default:
            println("Unknown minimap mod specified: ${project.minimap_mod}. Must be xaero, journey, ftb, atlas, or none")
            break
    }

    // Accessory Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.accessory_mod.toLowerCase(Locale.ROOT)) {
        case "accessories":
//            implementation "io.wispforest:accessories-fabric:${project.accessories_version}"
//            implementation "io.wispforest:owo-lib:${project.owo_version}"
//            implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
//                exclude(group: "net.fabricmc.fabric-api")
//            }
            break
        case "none":
            break
        default:
            println("Unknown accessory mod specified: ${project.accessory_mod}. Must be accessories, or none")
            break
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

publishMods {
    displayName = "${mod_id}-fabric-${minecraft_version}-${mod_version}"
    version = "${minecraft_version}-${mod_version}"
    file = tasks.jar.archiveFile
    modLoaders.add("fabric")

    curseforge("curseforgeFabric") {
        accessToken = System.getenv("CURSEFORGE_TOKEN")
        changelogType = "markdown"
        javaVersions.add(JavaVersion.toVersion(project.java_version))
        minecraftVersions.addAll(curseforge_gameVersions.split(","))
        projectId = project.curseforge_fabric_id

        requires("forge-config-api-port")
        optional("serene-seasons", "fabric-seasons", "fabric-seasons-extras", "homeostatic-seasons")
        optional("ftb-chunks-fabric", "journeymap", "xaeros-minimap", "xaeros-minimap-fair-play-edition", "map-atlases")
        optional("trinkets", "accessories")
    }

    modrinth("modrinthFabric") {
        accessToken = System.getenv("MODRINTH_TOKEN")
        minecraftVersions.addAll(modrinth_gameVersions.split(","))
        projectId = project.modrinth_fabric_id

        requires("forge-config-api-port")
        optional("serene-seasons", "fabric-seasons", "fabric-seasons-extras", "homeostatic-seasons")
        optional("journeymap", "xaeros-minimap", "xaeros-minimap-fair", "map-atlases")
        optional("trinkets", "accessories")
    }
}