plugins {
    id 'com.gradleup.shadow'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run-client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run-server")
        }
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation("net.fabricmc:fabric-loader:${project.fabric_loader_version}")

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Fabric Seasons + Extras
    modImplementation("maven.modrinth:fabric-seasons:${project.fabric_seasons_version}")
    modCompileOnly("maven.modrinth:fabric-seasons-extras:${project.fabric_seasons_extras_version}")

    // Xaero's Minimap
    modCompileOnly("maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_Fabric_1.19.1") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly ("xaero.lib:xaerolib-fabric-1.19.1:${project.xaero_lib_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // JourneyMap
    modCompileOnlyApi group: 'info.journeymap', name: 'journeymap-api', version: project.journeymap_api_version_fabric, changing: true
    modCompileOnly("maven.modrinth:journeymap:${project.journeymap_version_fabric}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // FTB Chunks + Dependencies
    modCompileOnly("dev.ftb.mods:ftb-library-fabric:${project.ftb_library_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("dev.ftb.mods:ftb-teams-fabric:${project.ftb_teams_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("dev.ftb.mods:ftb-chunks-fabric:${project.ftb_chunks_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("maven.modrinth:architectury-api:${project.architectury_version}+fabric") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    //Map Atlases
    modCompileOnly("curse.maven:map-atlases-436298:${project.map_atlases_fabric_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("maven.modrinth:moonlight:${project.moonlight_version_fabric}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("maven.modrinth:immediatelyfast:${project.immediatelyfast_version}+1.19.2-fabric") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Trinkets
    modCompileOnly("dev.emi:trinkets:${project.trinkets_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Accessories
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.1"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.1"

    // Forge Config API Port
    modImplementation 'com.electronwill.night-config:core:3.6.5'
    modImplementation 'com.electronwill.night-config:toml:3.6.5'
    modImplementation("net.minecraftforge:forgeconfigapiport-fabric:${project.forge_config_api_port_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Development QOL
    modLocalRuntime("me.djtheredstoner:DevAuth-fabric:${devauth_version}")
    modLocalRuntime "maven.modrinth:lazydfu:${project.lazydfu_version}"
    modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Minimap Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.minimap_mod.toLowerCase(Locale.ROOT)) {
        case "xaero":
            modLocalRuntime("maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_Fabric_1.19.1") {
                exclude group: 'net.fabricmc', module: 'fabric-loader'
            }
            modImplementation("xaero.lib:xaerolib-fabric-1.19.1:${project.xaero_lib_version}") {
                exclude group: 'net.fabricmc', module: 'fabric-loader'
            }
            break
        case "journey":
            modLocalRuntime("maven.modrinth:journeymap:${project.journeymap_version_fabric}")
            break
        case "ftb":
            modLocalRuntime "dev.ftb.mods:ftb-library-fabric:${project.ftb_library_version}"
            modLocalRuntime "dev.ftb.mods:ftb-teams-fabric:${project.ftb_teams_version}"
            modLocalRuntime "dev.ftb.mods:ftb-chunks-fabric:${project.ftb_chunks_version}"
            modLocalRuntime("maven.modrinth:architectury-api:${project.architectury_version}+fabric")
            break
        case "atlas":
            modLocalRuntime("curse.maven:map-atlases-436298:${project.map_atlases_fabric_version}")
            modLocalRuntime("maven.modrinth:moonlight:1.19.2-${project.moonlight_version_fabric}")
            modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-item:5.2.1")
            modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.1")
            break
        case "none":
            break
        default: println("Unknown minimap mod specified: ${project.minimap_mod}. Must be xaero, journey, ftb, " +
                "atlas, voxel, or none")
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

modrinth {
    debugMode = false
    token = System.getenv("MODRINTH_TOKEN")
    projectId = modrinth_fabric_id
    versionNumber = minecraft_version + "-" + version
    versionName = base.archivesName.get() + "-" + version
    versionType = "release"
    uploadFile = remapJar

    List<String> mcVersions = modrinth_gameVersions.split(",")
    gameVersions = mcVersions
    loaders = ["fabric"]

    changelog = projectDir.toPath().getParent().resolve("LATEST_CHANGELOG.md").getText()

    dependencies {
        required.project "fabric-seasons"
        optional.project "fabric-seasons-extras"
        required.project "forge-config-api-port"
        optional.project "journeymap"
        optional.project "trinkets"
        optional.project "xaeros-minimap"
        optional.project "xaeros-minimap-fair"
        optional.project "map-atlases"
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = "curseforge"

    debugMode = false
    disableVersionDetection()
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    def mainFile = upload(curseforge_fabric_id, remapJar)
    mainFile.changelogType = "markdown"
    mainFile.changelog = projectDir.toPath().getParent().resolve("LATEST_CHANGELOG.md").getText()
    mainFile.releaseType = "release"

    List<String> mcVersions = curseforge_gameVersions.split(",")
    mainFile.gameVersions = mcVersions
    mainFile.addGameVersion("Fabric")
    mainFile.addJavaVersion("Java 17")

    mainFile.addRequirement("fabric-seasons")
    mainFile.addRequirement("forge-config-api-port")
    mainFile.addOptional("fabric-seasons-extras")
    mainFile.addOptional("ftb-chunks-fabric")
    mainFile.addOptional("journeymap")
    mainFile.addOptional("trinkets")
    mainFile.addOptional("xaeros-minimap")
    mainFile.addOptional("xaeros-minimap-fair-play-edition")
    mainFile.addOptional("map-atlases")
}

tasks.register('publishFabric') {
    group = "upload"
    dependsOn(tasks.publishCurseForge)
    dependsOn(tasks.modrinth)
}