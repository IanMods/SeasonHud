plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }

    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")

    // Fabric Seasons + Extras
    modCompileOnly("maven.modrinth:fabric-seasons:${project.fabric_seasons_version}")
    modCompileOnly("maven.modrinth:fabric-seasons-extras:${project.fabric_seasons_extras_version}")

    // Serene Seasons
    modCompileOnly "com.github.glitchfiend:SereneSeasons-fabric:${project.serene_seasons_version}"
    modCompileOnly "com.github.glitchfiend:GlitchCore-fabric:${project.glitchcore_version}"
    compileOnly("net.jodah:typetools:0.6.3")

    // Xaero's Minimap
    modCompileOnly("maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_Fabric_${project.xaero_mc_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly "xaero.lib:xaerolib-fabric-${project.xaero_mc_version}:${project.xaero_lib_version}"

    // JourneyMap
    modCompileOnlyApi group: 'info.journeymap', name: 'journeymap-api', version: project.journeymap_api_version, changing: true
    modCompileOnly("maven.modrinth:journeymap:${project.journeymap_version_fabric}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // FTB Chunks + Dependencies
    modCompileOnly "dev.ftb.mods:ftb-library-fabric:${project.ftb_library_version}"
    modCompileOnly "dev.ftb.mods:ftb-teams-fabric:${project.ftb_teams_version}"
    modCompileOnly "dev.ftb.mods:ftb-chunks-fabric:${project.ftb_chunks_version}"
    modCompileOnly("maven.modrinth:architectury-api:${project.architectury_version}+fabric")

    // Map Atlases
    modCompileOnly("maven.modrinth:map-atlases:${project.map_atlases_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("maven.modrinth:moonlight:${project.moonlight_version_fabric}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modCompileOnly("maven.modrinth:immediatelyfast:${project.immediatelyfast_version}-fabric") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Trinkets
    modCompileOnly("dev.emi:trinkets:${project.trinkets_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Accessories
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
    modCompileOnly("io.wispforest:accessories-fabric:${project.accessories_version}")
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Forge Config API Port
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"
    modImplementation("maven.modrinth:forge-config-api-port:v${project.forge_config_api_port_version}-${project.minecraft_version}-Fabric") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // Development QOL
    modLocalRuntime("me.djtheredstoner:DevAuth-fabric:${project.devauth_version}")
    modLocalRuntime "maven.modrinth:lazydfu:${project.lazydfu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "maven.modrinth:text-animator:${project.text_animator_version_fabric}"

    // Season Mod Dev Tests (Fabric)
    // See root gradle.properties to choose which to use at runtime.
    switch (project.season_mod_fabric.toLowerCase(Locale.ROOT)) {
        case "serene":
            modLocalRuntime "com.github.glitchfiend:SereneSeasons-fabric:${project.serene_seasons_version}"
            modLocalRuntime "com.github.glitchfiend:GlitchCore-fabric:${project.glitchcore_version}"
            implementation("net.jodah:typetools:0.6.3")
            break
        case "fabric":
            modImplementation("maven.modrinth:fabric-seasons:${project.fabric_seasons_version}")
            break
        case "fabric+extra":
            modImplementation("maven.modrinth:fabric-seasons:${project.fabric_seasons_version}")
            modImplementation("maven.modrinth:fabric-seasons-extras:${project.fabric_seasons_extras_version}")
            break
        default: println("Unknown season mod specified: ${project.season_mod_fabric}. Must be serene or fabric")
    }

    // Minimap Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.minimap_mod.toLowerCase(Locale.ROOT)) {
        case "xaero":
            modLocalRuntime("maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_Fabric_${project.xaero_mc_version}")
            modLocalRuntime(group: "maven.modrinth", name: "xaeros-minimap", version: "${project.xaeros_minimap_version}_Fabric_${project.xaero_mc_version}")
            modImplementation "xaero.lib:xaerolib-fabric-${project.xaero_mc_version}:${project.xaero_lib_version}"
            break
        case "journey":
            modLocalRuntime("maven.modrinth:journeymap:${project.journeymap_version_fabric}")
            break
        case "ftb":
            modLocalRuntime "dev.ftb.mods:ftb-library-fabric:${project.ftb_library_version}"
            modLocalRuntime "dev.ftb.mods:ftb-teams-fabric:${project.ftb_teams_version}"
            modLocalRuntime "dev.ftb.mods:ftb-chunks-fabric:${project.ftb_chunks_version}"
            modLocalRuntime("maven.modrinth:architectury-api:${project.architectury_version}+fabric")
            break
        case "atlas":
            modLocalRuntime("maven.modrinth:map-atlases:1.20-${project.map_atlases_version}")
            modLocalRuntime("maven.modrinth:moonlight:1.20-${project.moonlight_version_fabric}")
            modLocalRuntime("maven.modrinth:immediatelyfast:${project.immediatelyfast_version}-fabric")
            modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-item:${project.cardinal_components_version}")
            modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}")
            modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}")
            break
        case "none":
            break
        default: println("Unknown minimap mod specified: ${project.minimap_mod}. Must be xaero, journey, ftb, " +
                "atlas, voxel, or none")
    }

    // Accessory Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.accessory_mod.toLowerCase(Locale.ROOT)) {
        case "accessories":
            modLocalRuntime "io.wispforest:accessories-fabric:${project.accessories_version}"
            modLocalRuntime "maven.modrinth:owo-lib:${project.owo_version}"
            modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
                exclude(group: "net.fabricmc.fabric-api")
            }
            break
        case "none":
            break
        default: println("Unknown accessory mod specified: ${project.accessory_mod}. Must be accessories, or none")
    }
}

modrinth {
    debugMode = true
    token = System.getenv("MODRINTH_TOKEN")
    projectId = modrinth_fabric_id
    versionNumber = minecraft_version + "-" + version
    versionName = base.archivesName.get() + "-" + version
    versionType = "release"
    uploadFile = jar

    List<String> mcVersions = modrinth_gameVersions.split(",")
    gameVersions = mcVersions
    loaders = ["fabric"]

    changelog = projectDir.toPath().getParent().resolve("LATEST_CHANGELOG.md").getText()

    dependencies {
        optional.project "serene-seasons"
        optional.project "fabric-seasons"
        optional.project "fabric-seasons-extras"
        required.project "forge-config-api-port"
        optional.project "journeymap"
        optional.project "trinkets"
        optional.project "accessories"
        optional.project "xaeros-minimap"
        optional.project "xaeros-minimap-fair"
        optional.project "map-atlases"
    }
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = "curseforge"

    debugMode = true
    disableVersionDetection()
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    def mainFile = upload(curseforge_fabric_id, jar)
    mainFile.changelogType = "markdown"
    mainFile.changelog = projectDir.toPath().getParent().resolve("LATEST_CHANGELOG.md").getText()
    mainFile.releaseType = "release"

    List<String> mcVersions = curseforge_gameVersions.split(",")
    mainFile.gameVersions = mcVersions
    mainFile.addGameVersion("Fabric")
    mainFile.addJavaVersion("Java 17")

    mainFile.addOptional("serene-seasons")
    mainFile.addOptional("fabric-seasons")
    mainFile.addRequirement("forge-config-api-port")
    mainFile.addOptional("fabric-seasons-extras")
    mainFile.addOptional("ftb-chunks-fabric")
    mainFile.addOptional("journeymap")
    mainFile.addOptional("trinkets")
    mainFile.addOptional("accessories")
    mainFile.addOptional("xaeros-minimap")
    mainFile.addOptional("xaeros-minimap-fair-play-edition")
    mainFile.addOptional("map-atlases")
}

tasks.register('publishFabric') {
    group = "upload"
    dependsOn(tasks.publishCurseForge)
    dependsOn(tasks.modrinth)
}