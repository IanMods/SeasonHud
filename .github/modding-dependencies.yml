# Fabric Loader
- repository: https://maven.fabricmc.net
  groupId: net.fabricmc
  artifactId: fabric-loader
  version: "*"
  properties:
    fabric_loader_version:
      source: version

# Fabric API
- repository: https://maven.fabricmc.net
  groupId: net.fabricmc.fabric-api
  artifactId: fabric-api
  version: "*+${mcVersion}"
  properties:
    fabric_api_version:
      source: version

# Forge
- repository: https://maven.minecraftforge.net/
  groupId: net.minecraftforge
  artifactId: forge
  version: "${mcVersion}-*"
  properties:
    forge_version:
      source: version

# Parchment
- repository: https://maven.parchmentmc.org/
  groupId: org.parchmentmc.data
  artifactId: parchment-${mcVersion}
  version: "*"
  properties:
    parchment_version:
      source: version

# DevAuth
- repository: https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1
  groupId: me.djtheredstoner
  artifactId: DevAuth-fabric
  version: "*"
  properties:
    devauth_version:
      source: version

# Mod Menu
- repository: https://maven.terraformersmc.com/releases/
  groupId: com.terraformersmc
  artifactId: modmenu
  version: "4.*"
  properties:
    modmenu_version:
      source: version

# Patchouli
- repository: https://api.modrinth.com/maven
  groupId: maven.modrinth
  artifactId: patchouli
  version: "${mcVersion}-*"
  properties:
    patchouli_version:
      source: version

# Xaero
- repository: https://api.modrinth.com/maven
  groupId: maven.modrinth
  artifactId: xaeros-minimap
  version: "${xaeros_minimap_version}_Fabric_${mcVersion}"
  properties:
    xaeros_minimap_version:
      source: wildcard

# Journeymap-API
- repository: https://jm.gserv.me/repository/maven-public/
  groupId: info.journeymap
  artifactId: journeymap-api
  version: "${mcVersion}-*"
  properties:
    journeymap_api_version_fabric:
      source: version

# Journeymap-Forge
- repository: https://api.modrinth.com/maven
  groupId: maven.modrinth
  artifactId: journeymap
  version: "${mcVersion}-*-forge"
  properties:
    journeymap_version_forge:
      source: version

# Journeymap-Fabric
- repository: https://api.modrinth.com/maven
  groupId: maven.modrinth
  artifactId: journeymap
  version: "${mcVersion}-*-fabric"
  properties:
    journeymap_version_fabric:
      source: version

# FTB Chunks
- repository: https://maven.ftb.dev/releases
  groupId: dev.ftb.mods
  artifactId: ftb-chunks-fabric
  version: "${mcMinor}0${mcPatch}.*"
  properties:
    ftb_chunks_version:
      source: version

# FTB Teams
- repository: https://maven.ftb.dev/releases
  groupId: dev.ftb.mods
  artifactId: ftb-teams-fabric
  version: "${mcMinor}0${mcPatch}.*"
  properties:
    ftb_teams_version:
      source: version

# FTB Library
- repository: https://maven.ftb.dev/releases
  groupId: dev.ftb.mods
  artifactId: ftb-library-fabric
  version: "${mcMinor}0${mcPatch}.*"
  properties:
    ftb_library_version:
      source: version

# Architectury
- repository: https://maven.shedaniel.me
  groupId: dev.architectury
  artifactId: architectury-fabric
  version: "6.*"
  properties:
    architectury_version:
      source: version

# Moonlight Forge
- repository: https://api.modrinth.com/maven
  groupId: maven.modrinth
  artifactId: moonlight
  version: "${mcVersion}-*-forge"
  properties:
    moonlight_version_forge:
      source: version

# Moonlight Fabric
- repository: https://api.modrinth.com/maven
  groupId: maven.modrinth
  artifactId: moonlight
  version: "${mcVersion}-*-fabric"
  properties:
    moonlight_version_fabric:
      source: version

# ImmediatelyFast
- repository: https://api.modrinth.com/maven
  groupId: maven.modrinth
  artifactId: immediatelyfast
  version: "${immediatelyfast_version}+1.19.2*"
  properties:
    immediatelyfast_version:
      source: wildcard

# Text Animator Forge
- repository: https://api.modrinth.com/maven
  groupId: maven.modrinth
  artifactId: text-animator
  version: "1.*"
  properties:
    text_animator_version_forge:
      source: version

# Text Animator Fabric
- repository: https://api.modrinth.com/maven
  groupId: maven.modrinth
  artifactId: text-animator
  version: "1.*"
  properties:
    text_animator_version_fabric:
      source: version