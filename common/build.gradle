plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = project.neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net/releases')
        content {
            includeGroup "com.github.glitchfiend"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = uri("https://cursemaven.com")
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth Maven"
                url = uri("https://api.modrinth.com/maven")
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = 'Sponge Maven'
        url = uri("https://repo.spongepowered.org/repository/maven-public/")
    }

    maven {
        name = "shedaniel Maven"
        url = uri("https://maven.shedaniel.me/")
        content {
            includeGroup "me.shedaniel"
            includeGroup "dev.architectury"
            includeGroup "me.shedaniel.cloth"
        }
    }

    maven {
        name = "Xaero Maven"
        url = uri("https://chocolateminecraft.com/maven")
        content {
            includeGroup "xaero.lib"
        }
    }

    maven {
        name = "Journeymap API MAven"
        url = uri("https://jm.gserv.me/repository/maven-public/")
        content {
            includeGroup "info.journeymap"
        }
    }

    maven {
        name = "Accessories Maven"
        url = uri("https://maven.wispforest.io/releases")
        content {
            includeGroup "io.wispforest"
            includeGroup "io.wispforest.endec"
        }
    }

    maven {
        name = "Forge Config API Port Maven"
        url = uri("https://raw.githubusercontent.com/Fuzss/modresources/main/maven/")
        content {
            includeGroup "fuzs.forgeconfigapiport"
        }
    }

    maven {
        name = "FTB Maven"
        url = uri("https://maven.ftb.dev/releases")
        content {
            includeGroup "dev.ftb.mods"
        }
    }

    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }

    maven {
        name = "ModMaven (Backup)"
        url = uri("https://modmaven.dev/")
    }

    maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net/releases')
        content {
            includeGroup "com.github.glitchfiend"
        }
    }

    maven {
        name = "Homeostatic Seasons"
        url = uri("https://raw.githubusercontent.com/wendall911/maven/main/")
        content {
            includeGroup "com.github.wendall911.climatesettings"
            includeGroup "com.github.wendall911.homeostaticseasons"
            includeGroup "technology.roughness.whitenoise"
        }
    }

    maven {
        name = "ModMaven (Backup)"
        url = uri("https://modmaven.dev/")
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: project.mixin_version
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation "org.ow2.asm:asm-tree:9.5"
    implementation "org.ow2.asm:asm-commons:9.5"
    implementation "org.ow2.asm:asm-util:9.5"

    // Config Mod
    api "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${project.forge_config_api_port_version}"

    //Season Mods
    // Not used in common unless they are actually  loaded.
    compileOnly "com.github.glitchfiend:SereneSeasons-common:${project.serene_seasons_version}"
    compileOnly "com.github.glitchfiend:GlitchCore-common:${glitchcore_version}"
    compileOnly group: 'com.github.wendall911.climatesettings', name: "climatesettings-${project.minecraft_version}-common", version: "${project.climatesettings_version}"
    compileOnly group: 'com.github.wendall911.homeostaticseasons', name: "homeostaticseasons-${project.minecraft_version}-common", version: "${project.homeostatic_seasons_version}"
    compileOnly group: 'technology.roughness.whitenoise', name: "whitenoise-${project.minecraft_version}-common", version: "${project.whitenoise_version}"

    // Minimap Mods
    // Not used in common unless they are actually loaded.
    compileOnly "maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_NeoForge_${project.xaero_mc_version}"
    compileOnly "xaero.lib:xaerolib-common-${project.xaero_mc_version}:${project.xaero_lib_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${project.ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${project.ftb_teams_version}"
    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:${project.ftb_chunks_version}"
    compileOnlyApi group: 'info.journeymap', name: 'journeymap-api-common', version: project.journeymap_api_version, changing: true
    compileOnly "maven.modrinth:journeymap:${project.journeymap_version_neoforge}"
    compileOnly "maven.modrinth:map-atlases-forge:${project.map_atlases_version_neoforge}"

    // Accessory Mods
    compileOnly "io.wispforest:accessories-common:${project.accessories_version}-mojmap"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}