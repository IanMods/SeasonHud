plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: project.mixin_version

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation "org.ow2.asm:asm-tree:9.5"
    implementation "org.ow2.asm:asm-commons:9.5"
    implementation "org.ow2.asm:asm-util:9.5"

    // Config Mod
    api "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${project.forge_config_api_port_version}"

    //Season Mods
    // Not used in common unless they are actually  loaded.
    modCompileOnly "com.github.glitchfiend:SereneSeasons-common:${project.serene_seasons_version}"
    modCompileOnly "com.github.glitchfiend:GlitchCore-common:${glitchcore_version}"
    modCompileOnly group: 'com.github.wendall911.climatesettings', name: "climatesettings-${project.minecraft_version}-common", version: "${project.climatesettings_version}"
    modCompileOnly group: 'com.github.wendall911.homeostaticseasons', name: "homeostaticseasons-${project.minecraft_version}-common", version: "${project.homeostatic_seasons_version}"
    modCompileOnly group: 'technology.roughness.whitenoise', name: "whitenoise-${project.minecraft_version}-common", version: "${project.whitenoise_version}"

    // Minimap Mods
    // Not used in common unless they are actually loaded.
    modCompileOnly "maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_NeoForge_${project.xaero_mc_version}"
    modCompileOnly "xaero.lib:xaerolib-common-${project.xaero_mc_version}:${project.xaero_lib_version}"
    modCompileOnly "dev.ftb.mods:ftb-library:${project.ftb_library_version}"
    modCompileOnly "dev.ftb.mods:ftb-teams:${project.ftb_teams_version}"
    modCompileOnly "dev.ftb.mods:ftb-chunks:${project.ftb_chunks_version}"
    modCompileOnlyApi group: 'info.journeymap', name: 'journeymap-api', version: project.journeymap_api_version, changing: true
    modCompileOnly "maven.modrinth:journeymap:${project.journeymap_version_neoforge}"
    compileOnly "maven.modrinth:map-atlases-forge:${project.map_atlases_version_neoforge}"

    // Accessory Mods
    compileOnly "io.wispforest:accessories-common:${project.accessories_version}-mojmap"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}