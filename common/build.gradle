plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net/releases')
        content {
            includeGroup "com.github.glitchfiend"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = uri("https://cursemaven.com")
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth Maven"
                url = uri("https://api.modrinth.com/maven")
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = 'Sponge Maven'
        url = uri("https://repo.spongepowered.org/repository/maven-public/")
    }

    maven {
        name = "shedaniel Maven"
        url = uri("https://maven.shedaniel.me/")
        content {
            includeGroup "me.shedaniel"
            includeGroup "dev.architectury"
            includeGroup "me.shedaniel.cloth"
        }
    }

    maven {
        name = "Xaero Maven"
        url = uri("https://chocolateminecraft.com/maven")
        content {
            includeGroup "xaero.lib"
            includeGroup "xaero.minimap"
        }
    }

    maven {
        name = "Journeymap API MAven"
        url = uri("https://jm.gserv.me/repository/maven-public/")
        content {
            includeGroup "info.journeymap"
        }
    }

    maven {
        name = "Accessories Maven"
        url = uri("https://maven.wispforest.io/releases")
        content {
            includeGroup "io.wispforest"
            includeGroup "io.wispforest.endec"
        }
    }

    maven {
        name = "Forge Config API Port Maven"
        url = uri("https://raw.githubusercontent.com/Fuzss/modresources/main/maven/")
        content {
            includeGroup "fuzs.forgeconfigapiport"
        }
    }

    maven {
        name = "FTB Maven"
        url = uri("https://maven.ftb.dev/releases")
        content {
            includeGroup "dev.ftb.mods"
        }
    }

    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "info.journeymap"
        }
    }

    maven {
        name = "ModMaven (Backup)"
        url = uri("https://modmaven.dev/")
    }

    maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net/releases')
        content {
            includeGroup "com.github.glitchfiend"
        }
    }

    maven {
        name = "Homeostatic Seasons"
        url = uri("https://raw.githubusercontent.com/wendall911/maven/main/")
        content {
            includeGroup "com.github.wendall911.climatesettings"
            includeGroup "com.github.wendall911.homeostaticseasons"
            includeGroup "technology.roughness.whitenoise"
        }
    }

    maven {
        name = "ModMaven (Backup)"
        url = uri("https://modmaven.dev/")
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: project.mixin_version

    implementation "org.ow2.asm:asm-tree:9.5"
    implementation "org.ow2.asm:asm-commons:9.5"
    implementation "org.ow2.asm:asm-util:9.5"

    // Config Mod
    api "fuzs.forgeconfigapiport:forgeconfigapiport-common:${project.forge_config_api_port_version}"

    //Season Mods
    modCompileOnly "com.github.glitchfiend:SereneSeasons-common:${project.serene_seasons_version}"
    modCompileOnly "com.github.glitchfiend:GlitchCore-common:${project.glitchcore_version}"

    // Minimap Mods
    // Not used in common unless they are actually loaded.
    modCompileOnly "xaero.minimap:xaerominimap-common-${project.minecraft_version}:${project.xaero_minimap_version}"
    modCompileOnly "xaero.lib:xaerolib-common-${project.minecraft_version}:${project.xaero_lib_version}"
    modCompileOnly "dev.ftb.mods:ftb-library-forge:${project.ftb_library_version}"
    modCompileOnly "dev.ftb.mods:ftb-teams-forge:${project.ftb_teams_version}"
    modCompileOnly "dev.ftb.mods:ftb-chunks-forge:${project.ftb_chunks_version}"
    modCompileOnly("info.journeymap:journeymap-api-common:${project.journeymap_api_version}") {
        changing = true
    }
    modCompileOnly "maven.modrinth:journeymap:${project.journeymap_version_forge}"
    compileOnly "maven.modrinth:map-atlases-forge:${project.map_atlases_version}"

    // Accessory Mods
    compileOnly "io.wispforest:accessories-common:${project.accessories_version}-mojmap"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}