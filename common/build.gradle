architectury {
    common enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    api "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${project.forge_config_api_port_version}"
    api group: 'info.journeymap', name: 'journeymap-api-common', version: project.journeymap_api_version, changing: true
    compileOnly "com.github.glitchfiend:GlitchCore-common:${minecraft_version}-${glitchcore_version}"
    modCompileOnly "io.wispforest:accessories-common:${project.accessories_version}-mojmap"
    modCompileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
    //modCompileOnly "maven.modrinth:accessories-cc-layer:7.4.0-beta.18"
    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"

    // Minimap Mods
    // Not used in common unless they are actually  loaded.
    modCompileOnly "maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_NeoForge_${minecraft_version}"
    modCompileOnly "dev.ftb.mods:ftb-library:${project.ftb_library_version}"
    modCompileOnly "dev.ftb.mods:ftb-teams:${project.ftb_teams_version}"
    modCompileOnly "dev.ftb.mods:ftb-chunks:${project.ftb_chunks_version}"
    modCompileOnly "maven.modrinth:journeymap:${project.journeymap_version}+neoforge"
    modCompileOnly "maven.modrinth:map-atlases-forge:neoforge_1.21-${project.map_atlases_version}"

    //Season Mods
    // Not used in common unless they are actually  loaded.
    modCompileOnly "maven.modrinth:serene-seasons:${project.serene_seasons_version}-neoforge"
    modCompileOnly "maven.modrinth:glitchcore:${project.glitchcore_version}-neoforge"
    modCompileOnly "maven.modrinth:fabric-seasons:${project.fabric_seasons_version}"
    modCompileOnly "maven.modrinth:fabric-seasons-extras:${project.fabric_seasons_extras_version}"
    modCompileOnly "maven.modrinth:terrafirmacraft:${project.terrafirmacraft_version}"
    modCompileOnly "curse.maven:ecliptic-seasons-1118306:${project.ecliptic_seasons_version}"
}