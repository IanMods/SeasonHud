architectury {
    common enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    // Config Mod
    implementation 'com.electronwill.night-config:core:3.6.3'
    implementation 'com.electronwill.night-config:toml:3.6.3'
    compileOnly "net.minecraftforge:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

    //Season Mods
    // Not used in common unless they are actually  loaded.
    modCompileOnly "maven.modrinth:serene-seasons:${project.serene_seasons_version}-forge"
    modCompileOnly "maven.modrinth:fabric-seasons:${project.fabric_seasons_version}"
    modCompileOnly "maven.modrinth:fabric-seasons-extras:${project.fabric_seasons_extras_version}"
    modCompileOnly "maven.modrinth:terrafirmacraft:${project.terrafirmacraft_version}"
    modCompileOnly "curse.maven:ecliptic-seasons-1118306:${project.ecliptic_seasons_version}"

    // Minimap Mods
    // Not used in common unless they are actually  loaded.
    modCompileOnly "maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}_Forge_1.19.1"
    modCompileOnly "xaero.lib:xaerolib-common-1.19.1:${project.xaero_lib_version}"
    modCompileOnly "dev.ftb.mods:ftb-library:${project.ftb_library_version}"
    modCompileOnly "dev.ftb.mods:ftb-teams:${project.ftb_teams_version}"
    modCompileOnly "dev.ftb.mods:ftb-chunks:${project.ftb_chunks_version}"
    modCompileOnly "maven.modrinth:journeymap:${project.journeymap_version_forge}"
    modCompileOnly "curse.maven:map-atlases-forge-519759:${project.map_atlases_forge_version}"

    // Accessory Mods
    // Not used in common unless they are actually  loaded.
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.1"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.1"
    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"
    modCompileOnly "top.theillusivec4.curios:curios-forge:${project.curios_version}"
}