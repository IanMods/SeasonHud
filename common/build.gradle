plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net/releases')
        content {
            includeGroup "com.github.glitchfiend"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = uri("https://cursemaven.com")
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth Maven"
                url = uri("https://api.modrinth.com/maven")
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = 'Sponge Maven'
        url = uri("https://repo.spongepowered.org/repository/maven-public/")
    }

    maven {
        name = "shedaniel Maven"
        url = uri("https://maven.shedaniel.me/")
        content {
            includeGroup "me.shedaniel"
            includeGroup "dev.architectury"
            includeGroup "me.shedaniel.cloth"
        }
    }

    maven {
        name = "Xaero Maven"
        url = uri("https://chocolateminecraft.com/maven")
        content {
            includeGroup "xaero.lib"
            includeGroup "xaero.minimap"
        }
    }

    maven {
        name = "Journeymap API MAven"
        url = uri("https://jm.gserv.me/repository/maven-public/")
        content {
            includeGroup "info.journeymap"
        }
    }

    maven {
        name = "Accessories Maven"
        url = uri("https://maven.wispforest.io/releases")
        content {
            includeGroup "io.wispforest"
            includeGroup "io.wispforest.endec"
        }
    }

    maven {
        name = "Forge Config API Port Maven"
        url = uri("https://raw.githubusercontent.com/Fuzss/modresources/main/maven/")
        content {
            includeGroup "fuzs.forgeconfigapiport"
        }
    }

    maven {
        name = "FTB Maven"
        url = uri("https://maven.ftb.dev/releases")
        content {
            includeGroup "dev.ftb.mods"
        }
    }

    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }

    maven {
        name = "ModMaven (Backup)"
        url = uri("https://modmaven.dev/")
    }

    maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net/releases')
        content {
            includeGroup "com.github.glitchfiend"
        }
    }

    maven {
        name = "Homeostatic Seasons"
        url = uri("https://raw.githubusercontent.com/wendall911/maven/main/")
        content {
            includeGroup "com.github.wendall911.climatesettings"
            includeGroup "com.github.wendall911.homeostaticseasons"
            includeGroup "technology.roughness.whitenoise"
        }
    }

    maven {
        name = "ModMaven (Backup)"
        url = uri("https://modmaven.dev/")
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:${project.mixin_version}"
    compileOnly(annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixin_extras_version}")

    implementation "com.google.code.findbugs:jsr305:3.0.1"
    implementation "org.ow2.asm:asm-tree:9.5"
    implementation "org.ow2.asm:asm-commons:9.5"
    implementation "org.ow2.asm:asm-util:9.5"

    compileOnly "com.demonwav.mcdev:annotations:2.1.0"

    // Config Mod
    api "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${project.forge_config_api_port_version}"

    //Season Mods
    // Not used in common unless they are actually  loaded.
    compileOnly "com.github.glitchfiend:SereneSeasons-common:${project.serene_seasons_version}"
    compileOnly "com.github.glitchfiend:GlitchCore-common:${glitchcore_version}"
    compileOnly "com.github.wendall911.climatesettings:climatesettings-${project.minecraft_version}-common:${project.climatesettings_version}"
    compileOnly "com.github.wendall911.homeostaticseasons:homeostaticseasons-${project.minecraft_version}-common:${project.homeostatic_seasons_version}"
    compileOnly "technology.roughness.whitenoise:whitenoise-${project.minecraft_version}-common:${project.whitenoise_version}"
    compileOnly "maven.modrinth:protomanlys-weather:${project.protomanlys_version}"

    // Minimap Mods
    // Not used in common unless they are actually loaded.
    compileOnly "xaero.minimap:xaerominimap-common-${project.xaero_mc_version}:${project.xaero_minimap_version}"
    compileOnly "xaero.lib:xaerolib-common-${project.minecraft_version}:${project.xaero_lib_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${project.ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${project.ftb_teams_version}"
    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:${project.ftb_chunks_version}"
    compileOnlyApi("info.journeymap:journeymap-api-common:${project.journeymap_api_version}") {
        changing = true
    }
    compileOnly "maven.modrinth:journeymap:${project.journeymap_version_neoforge}"
    compileOnly "maven.modrinth:map-atlases-forge:${project.map_atlases_version_neoforge}"

    // Accessory Mods
    compileOnly "io.wispforest:accessories-common:${project.accessories_version}-mojmap"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}