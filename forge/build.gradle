plugins {
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

loom {
    forge {
        mixinConfig "seasonhud.forge.mixins.json"
    }

    runs {
        client {
            client()
            setConfigName("Forge Client")
            ideConfigGenerated(true)
            runDir("run-client")
        }
        server {
            server()
            setConfigName("Forge Server")
            ideConfigGenerated(true)
            runDir("run-server")
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:${project.forge_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    //Serene Seasons
    modCompileOnly "maven.modrinth:serene-seasons:${project.serene_seasons_version}"

    // Terrafirmacraft
    modCompileOnly "maven.modrinth:terrafirmacraft:${project.terrafirmacraft_version}"
    modCompileOnly "maven.modrinth:patchouli:${project.patchouli_version}-forge"
    modCompileOnly "maven.modrinth:barrels-2012:${project.barrels_version}"

    // Ecliptic Seasons
    modCompileOnly "curse.maven:ecliptic-seasons-1118306:${project.ecliptic_seasons_version}"

    // Xaero's Minimap
    modCompileOnly "maven.modrinth:xaeros-minimap:forge-${project.xaero_mc_version}-${project.xaero_minimap_version}"
    modCompileOnly "xaero.minimap:xaerominimap-forge-${project.xaero_mc_version}:${project.xaero_minimap_version}"
    modCompileOnly "xaero.lib:xaerolib-forge-${project.xaero_mc_version}:${project.xaero_lib_version}"

    // JourneyMap
    modCompileOnly "maven.modrinth:journeymap:${project.journeymap_version_forge}"

    // FTB Chunks + Dependencies
    modCompileOnly "curse.maven:ftb-chunks-forge-314906:${project.ftb_chunks_forge_version}"
    modCompileOnly "curse.maven:ftb-library-forge-404465:${project.ftb_library_forge_version}"
    //modCompileOnly "curse.maven:ftb-teams-forge-404468:${project.ftb_teams_forge_version}"
    modCompileOnly "maven.modrinth:architectury-api:${project.architectury_version}+forge"

    //Map Atlases
    modCompileOnly "curse.maven:map-atlases-forge-519759:${project.map_atlases_forge_version}"

    //VoxelMap
    modCompileOnly "curse.maven:voxelmap-225179:${project.voxelmap_forge_version}"

    //Curios + Accessories
    modCompileOnly "top.theillusivec4.curios:curios-forge:${project.curios_version}:api"

    // Development QOL
    implementation("me.djtheredstoner:DevAuth-forge-latest:${devauth_version}")

    // Minimap Mod Dev Tests
    // See root gradle.properties to choose which to use at runtime.
    switch (project.minimap_mod.toLowerCase(Locale.ROOT)) {
        case "xaero":
            modImplementation "xaero.minimap:xaerominimap-forge-${project.xaero_mc_version}:${project.xaero_minimap_version}"
            modImplementation "xaero.lib:xaerolib-forge-${project.xaero_mc_version}:${project.xaero_lib_version}"
            break
        case "journey":
            modImplementation "maven.modrinth:journeymap:${project.journeymap_version_forge}"
            break
        case "ftb":
            modLocalRuntime "curse.maven:ftb-chunks-forge-314906:${project.ftb_chunks_forge_version}"
            modLocalRuntime "curse.maven:ftb-library-forge-404465:${project.ftb_library_forge_version}"
            modLocalRuntime "curse.maven:ftb-teams-forge-404468:${project.ftb_teams_forge_version}"
            modLocalRuntime "maven.modrinth:architectury-api:${project.architectury_version}+forge"
            break
        case "atlas":
            modLocalRuntime "curse.maven:map-atlases-forge-519759:${project.map_atlases_forge_version}"
            break
        case "voxel":
            modLocalRuntime("curse.maven:voxelmap-225179:${project.voxelmap_forge_version}")
            break
        case "none":
            break
        default: println("Unknown minimap mod specified: ${project.minimap_mod}. Must be xaero, journey, ftb, " +
                "atlas, voxel, or none")
    }

    // Season Mod Dev Tests (Forge)
    // See root gradle.properties to choose which to use at runtime.
    switch (project.season_mod_forge.toLowerCase(Locale.ROOT)) {
        case "serene":
            modLocalRuntime "maven.modrinth:serene-seasons:${project.serene_seasons_version}"
            break
        case "terra":
            modImplementation "maven.modrinth:terrafirmacraft:${project.terrafirmacraft_version}"
            modImplementation "maven.modrinth:patchouli:${project.patchouli_version}-forge"
            modImplementation "maven.modrinth:curios:${project.curios_version}"
            modImplementation "maven.modrinth:barrels-2012:${project.barrels_version}"
            break
        case "ecliptic":
            modImplementation "curse.maven:ecliptic-seasons-1118306:${project.ecliptic_seasons_version}"
            break
        default: println("Unknown season mod specified: ${project.minimap_mod}. Must be serene, terra, or ecliptic")
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publishMods {
    dryRun = false
    type = STABLE
    changelog = project.getRootDir().toPath().resolve("LATEST_CHANGELOG.md").getText()
    displayName = "${mod_id}-forge-${minecraft_version}-${mod_version}"
    version = "${minecraft_version}-${mod_version}"
    file = tasks.remapJar.archiveFile
    modLoaders.add("forge")

    curseforge("curseforgeForge") {
        accessToken = System.getenv("CURSEFORGE_TOKEN")
        changelogType = "markdown"
        javaVersions.add(JavaVersion.toVersion(project.java_version))
        minecraftVersions.addAll(curseforge_gameVersions.split(","))
        projectId = project.curseforge_forge_id

        if (minecraft_version == "1.20.1") {
            modLoaders.add("neoforge")
        }

        optional("serene-seasons", "terrafirmacraft", "ecliptic-seasons")
        optional("ftb-chunks-forge", "journeymap", "xaeros-minimap", "xaeros-minimap-fair-play-edition", "map-atlases-forge", "voxelmap")
        optional("curios")
    }

    modrinth("modrinthForge") {
        accessToken = System.getenv("MODRINTH_TOKEN")
        minecraftVersions.addAll(modrinth_gameVersions.split(","))
        projectId = project.modrinth_forge_id

        if (minecraft_version == "1.20.1") {
            modLoaders.add("neoforge")
        }

        optional("serene-seasons", "terrafirmacraft")
        optional("journeymap", "xaeros-minimap", "xaeros-minimap-fair", "map-atlases-forge")
        optional("curios")
    }
}